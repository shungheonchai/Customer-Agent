name: bookly-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: bookly_local
      POSTGRES_DB: bookly
    ports:
      - "127.0.0.1:${BOOKLY_DB_PORT:-5435}:5432"
    volumes:
      - bookly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly -d bookly"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:${BOOKLY_WEB_PORT:-8010}:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://bookly:bookly_local@postgres:5432/bookly
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8010/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  bookly_data:

